[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curlike"
version = "1.0.0"
description = "A curl-like HTTP client for the command line, powered by httpx"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["curl", "http", "cli", "httpx", "http-client"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
http2 = ["h2>=4.1"]
brotli = ["brotli"]
zstd = ["zstd"]

[project.scripts]
curlike = "curlike.cli:main"

[tool.setuptools]
packages = ["curlike"]

[tool.ruff]
line-length = 100
target-version = "py310"